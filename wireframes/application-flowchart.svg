<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#2563eb"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#16a34a"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#f5f7fb"/>
  <rect x="55" y="35" width="1810" height="90" rx="24" fill="#173b68"/>
  <text x="960" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#fff">TCG Card Store — Application Flowchart</text>
  <text x="960" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#cfe3ff">User journey, authentication และ feature flows</text>

  <!-- Start and authentication -->
  <g font-family="Arial,sans-serif">
    <rect x="90" y="205" width="190" height="62" rx="31" fill="#1d4ed8" filter="url(#shadow)"/>
    <text x="185" y="244" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">เปิด Application</text>

    <path d="M280 236 L350 236" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <polygon points="430,180 510,236 430,292 350,236" fill="#fff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
    <text x="430" y="231" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">มี Session?</text>
    <text x="430" y="255" text-anchor="middle" font-size="14" fill="#475569">Auth Guard</text>

    <path d="M510 236 L610 236" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#greenArrow)"/>
    <text x="545" y="220" font-size="16" font-weight="700" fill="#16a34a">ใช่</text>
    <rect x="610" y="200" width="190" height="72" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
    <text x="705" y="231" text-anchor="middle" font-size="22" font-weight="800" fill="#166534">Home</text>
    <text x="705" y="255" text-anchor="middle" font-size="14" fill="#166534">Dashboard / Menu</text>

    <path d="M430 292 C430 375 300 375 300 430" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#redArrow)"/>
    <text x="330" y="365" font-size="16" font-weight="700" fill="#dc2626">ไม่มี</text>
    <rect x="205" y="430" width="190" height="72" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
    <text x="300" y="461" text-anchor="middle" font-size="22" font-weight="800" fill="#991b1b">Login</text>
    <text x="300" y="485" text-anchor="middle" font-size="14" fill="#991b1b">กรอก Username / Password</text>

    <path d="M395 466 L475 466" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <polygon points="560,415 640,466 560,517 480,466" fill="#fff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
    <text x="560" y="461" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">ข้อมูลถูกต้อง?</text>

    <path d="M640 466 L730 466 L730 236 L610 236" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#greenArrow)"/>
    <text x="675" y="450" font-size="16" font-weight="700" fill="#16a34a">ใช่ → Home</text>
    <path d="M560 517 L560 575 L300 575 L300 502" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#redArrow)"/>
    <text x="410" y="563" font-size="16" font-weight="700" fill="#dc2626">ไม่ใช่: แสดง Error</text>

    <rect x="90" y="630" width="190" height="72" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
    <text x="185" y="661" text-anchor="middle" font-size="21" font-weight="800" fill="#5b21b6">Register</text>
    <text x="185" y="685" text-anchor="middle" font-size="14" fill="#5b21b6">สร้างบัญชีใหม่</text>
    <path d="M205 502 C150 535 185 590 185 630" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="112" y="565" font-size="15" font-weight="700" fill="#5b21b6">สมัครสมาชิก</text>
    <path d="M280 666 L350 666 L350 466 L475 466" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="295" y="650" font-size="15" fill="#5b21b6">สมัครสำเร็จ → Login</text>
  </g>

  <!-- Feature menu -->
  <rect x="855" y="160" width="965" height="755" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="895" y="207" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#1d4ed8">Home Feature Menu</text>
  <text x="895" y="235" font-family="Arial,sans-serif" font-size="16" fill="#475569">เลือกฟังก์ชันจาก Dashboard แล้วกลับ Home ได้ทุกหน้า</text>

  <!-- Home connector -->
  <path d="M800 236 L850 236 L850 255 L960 255" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#greenArrow)"/>

  <!-- Feature nodes -->
  <g font-family="Arial,sans-serif">
    <rect x="960" y="270" width="245" height="130" rx="16" fill="#fff" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
    <text x="1082" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#166534">Shop</text>
    <text x="1082" y="338" text-anchor="middle" font-size="15" fill="#475569">โหลด cards จาก Firestore</text>
    <text x="1082" y="365" text-anchor="middle" font-size="15" fill="#475569">ดูรายการ → หยิบใส่ตะกร้า</text>
    <rect x="1260" y="270" width="245" height="130" rx="16" fill="#fff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
    <text x="1382" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">Sell Card</text>
    <text x="1382" y="338" text-anchor="middle" font-size="15" fill="#475569">เลือกรูป / เปิดกล้อง</text>
    <text x="1382" y="365" text-anchor="middle" font-size="15" fill="#475569">บันทึก card → Firestore</text>
    <rect x="1560" y="270" width="210" height="130" rx="16" fill="#fff" stroke="#f97316" stroke-width="3" filter="url(#shadow)"/>
    <text x="1665" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#c2410c">Auction</text>
    <text x="1665" y="338" text-anchor="middle" font-size="15" fill="#475569">สร้างรายการประมูล</text>
    <text x="1665" y="365" text-anchor="middle" font-size="15" fill="#475569">เสนอราคา / Bid</text>

    <rect x="960" y="500" width="245" height="130" rx="16" fill="#fff" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
    <text x="1082" y="540" text-anchor="middle" font-size="22" font-weight="800" fill="#6d28d9">Event</text>
    <text x="1082" y="568" text-anchor="middle" font-size="15" fill="#475569">Admin สร้างการแข่งขัน</text>
    <text x="1082" y="595" text-anchor="middle" font-size="15" fill="#475569">User ลงทะเบียน</text>
    <rect x="1260" y="500" width="245" height="130" rx="16" fill="#fff" stroke="#eab308" stroke-width="3" filter="url(#shadow)"/>
    <text x="1382" y="540" text-anchor="middle" font-size="22" font-weight="800" fill="#a16207">Tier List</text>
    <text x="1382" y="568" text-anchor="middle" font-size="15" fill="#475569">ค้นหา / กรองเด็ค</text>
    <text x="1382" y="595" text-anchor="middle" font-size="15" fill="#475569">เปิดดูรายละเอียดเด็ค</text>
    <rect x="1560" y="500" width="210" height="130" rx="16" fill="#fff" stroke="#64748b" stroke-width="3" filter="url(#shadow)"/>
    <text x="1665" y="540" text-anchor="middle" font-size="22" font-weight="800" fill="#334155">Logout</text>
    <text x="1665" y="568" text-anchor="middle" font-size="15" fill="#475569">ล้าง Session</text>
    <text x="1665" y="595" text-anchor="middle" font-size="15" fill="#475569">กลับไป Login</text>

    <rect x="960" y="725" width="810" height="125" rx="16" fill="#fff" stroke="#64748b" stroke-width="3"/>
    <text x="1365" y="765" text-anchor="middle" font-size="22" font-weight="800" fill="#334155">Shared Data / Feedback</text>
    <text x="1365" y="795" text-anchor="middle" font-size="16" fill="#475569">Firestore cards • Toast success • Validation • Error handling</text>
    <text x="1365" y="822" text-anchor="middle" font-size="16" fill="#475569">ทุก feature สามารถกลับ Home ผ่านปุ่ม Back ได้</text>
  </g>

  <!-- Menu connectors -->
  <g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)">
    <path d="M960 255 L1082 270"/>
    <path d="M960 255 L1382 270"/>
    <path d="M960 255 L1665 270"/>
    <path d="M960 255 C920 330 920 540 960 555"/>
    <path d="M960 255 C920 430 1180 480 1260 555"/>
    <path d="M960 255 C930 430 1500 440 1560 555"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)">
    <path d="M1082 400 L1082 725"/>
    <path d="M1382 400 L1382 725"/>
    <path d="M1665 400 L1665 725"/>
    <path d="M1082 630 L1082 725"/>
    <path d="M1382 630 L1382 725"/>
  </g>
  <path d="M1665 630 C1830 650 1820 200 800 236" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#redArrow)"/>
  <text x="1740" y="465" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dc2626" transform="rotate(-80 1740 465)">Logout → Login</text>

  <!-- Legend and technical notes -->
  <rect x="70" y="955" width="1780" height="75" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="100" y="987" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#334155">Legend:</text>
  <line x1="180" y1="981" x2="245" y2="981" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="260" y="987" font-family="Arial,sans-serif" font-size="15" fill="#475569">navigation / process</text>
  <line x1="470" y1="981" x2="535" y2="981" stroke="#16a34a" stroke-width="4" marker-end="url(#greenArrow)"/><text x="550" y="987" font-family="Arial,sans-serif" font-size="15" fill="#475569">success / authenticated</text>
  <line x1="800" y1="981" x2="865" y2="981" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#redArrow)"/><text x="880" y="987" font-family="Arial,sans-serif" font-size="15" fill="#475569">error / logout</text>
  <text x="100" y="1015" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Primary routes: /login • /register • /home • /shop • /event • /sell-card • /auction • /tier-list</text>
</svg>
