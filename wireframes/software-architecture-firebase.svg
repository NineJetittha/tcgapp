  <text x="755" y="438" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">Angular production build</text>
  <text x="755" y="476" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">SPA rewrite → index.html</text>
  <text x="755" y="512" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">HTTPS / CDN</text>

