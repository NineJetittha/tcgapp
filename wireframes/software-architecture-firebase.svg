  <text x="570" y="260" font-family="Arial" font-size="17" fill="#92400e">Managed cloud services • HTTPS • global hosting • serverless data access</text>

  <rect x="590" y="315" width="330" height="215" rx="18" fill="#fff" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
  <text x="755" y="360" text-anchor="middle" font-family="Arial" font-size="25" font-weight="800" fill="#b91c1c">Firebase Hosting</text>
