  <text x="1175" y="710" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Ionic + Angular • Routes • Guards • CardService • Camera / Capacitor</text>
  <text x="1175" y="750" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">Home • Shop • Event • Auction • Sell Card • Tier List</text>
  <text x="1175" y="782" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Static assets and production bundles served by Firebase Hosting</text>

  <rect x="75" y="935" width="1760" height="80" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="105" y="970" font-family="Arial" font-size="17" font-weight="700" fill="#334155">Deployment flow:</text>
  <text x="270" y="970" font-family="Arial" font-size="17" fill="#334155">npm run build -- --configuration production</text>
  <text x="760" y="970" font-family="Arial" font-size="17" fill="#334155">→</text>
  <text x="805" y="970" font-family="Arial" font-size="17" fill="#334155">frontend/www</text>
  <text x="1040" y="970" font-family="Arial" font-size="17" fill="#334155">→</text>
  <text x="1085" y="970" font-family="Arial" font-size="17" fill="#334155">firebase deploy --only hosting</text>
  <text x="105" y="998" font-family="Arial" font-size="15" fill="#64748b">Production URL: https://tcgapp-13983.web.app  •  Firestore project: tcgapp-13983</text>

