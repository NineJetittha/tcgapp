  <text x="1585" y="400" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">User identity / sessions</text>
  <text x="1585" y="438" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">Login &amp; access control</text>
