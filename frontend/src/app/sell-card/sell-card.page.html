<ion-header class="ion-no-border">
  <ion-toolbar class="bg-white">
    <div class="flex justify-between items-center px-4 py-2">
      <button (click)="goBack()" class="text-blue-600 font-bold bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 transition">
        &larr; กลับหน้าหลัก
      </button>
      <h1 class="text-xl font-extrabold text-gray-800 m-0">ลงขายการ์ด</h1>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-gray-50">
  <div class="p-4 md:p-6 max-w-5xl mx-auto">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
      <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">ลงขายการ์ดใหม่</h2>
      <form (ngSubmit)="onSubmit()" #tradeForm="ngForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label class="text-sm font-semibold text-gray-600">รูปภาพการ์ด</label>
          <div *ngIf="cameraActive" class="relative border-2 border-blue-300 rounded-xl overflow-hidden bg-black">
            <video #cameraPreview [srcObject]="cameraStream" autoplay playsinline class="w-full h-48 object-cover"></video>
            <button type="button" (click)="capturePhoto(cameraPreview, photoCanvas)" class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-lg">
              ถ่ายรูป
            </button>
            <button type="button" (click)="stopCamera()" class="absolute top-2 right-2 bg-black/60 hover:bg-black/80 text-white px-3 py-1 rounded-lg">
              ปิดกล้อง
            </button>
          </div>
          <div *ngIf="!cameraActive" class="relative border-2 border-dashed border-gray-300 rounded-xl p-4 flex flex-col items-center justify-center h-48 bg-gray-50 hover:bg-gray-100 transition">
            <input id="file-upload" type="file" (change)="onFileSelected($event)" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
            <ng-container *ngIf="!trade.image">
              <div class="text-center">
                <p class="mt-1 text-sm text-gray-500">คลิกหรือลากรูปมาวางที่นี่</p>
              </div>
            </ng-container>
            <img *ngIf="trade.image" [src]="trade.image" class="w-full h-full object-contain rounded-lg" />
          </div>
          <canvas #photoCanvas class="hidden"></canvas>
          <div class="flex gap-2">
            <button type="button" (click)="startCamera()" [disabled]="cameraActive" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-semibold py-2 px-3 rounded-lg disabled:opacity-50">
              เปิดกล้อง
            </button>
            <button type="button" (click)="downloadPhoto()" [disabled]="!trade.image" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-3 rounded-lg disabled:opacity-50">
              บันทึกภาพ
            </button>
          </div>
        </div>

        <div class="flex flex-col gap-4">
          <div>
            <label class="text-sm font-semibold text-gray-600">ชื่อ / ประเภทการ์ด</label>
            <input type="text" [(ngModel)]="trade.cardType" name="cardType" required class="w-full mt-1 p-3 border border-gray-300 rounded-lg" />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-sm font-semibold text-gray-600">ราคา (บาท)</label>
              <input type="number" [(ngModel)]="trade.price" name="price" min="0" required class="w-full mt-1 p-3 border border-gray-300 rounded-lg" />
            </div>
            <div>
              <label class="text-sm font-semibold text-gray-600">วันที่ลงขาย</label>
              <input type="date" [(ngModel)]="trade.date" name="date" required class="w-full mt-1 p-3 border border-gray-300 rounded-lg" />
            </div>
          </div>
          <button type="submit" [disabled]="isSubmitting || tradeForm.invalid || !trade.image" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg mt-4 disabled:opacity-50">
            {{ isSubmitting ? 'กำลังบันทึก...' : 'บันทึกและเปิดหน้าร้านค้า' }}
          </button>
        </div>
      </form>
    </div>

    <!-- แสดงรายการที่เพิ่งลงขาย -->
    <h2 class="text-xl font-bold mb-4 text-gray-800">รายการที่เพิ่งลงขาย</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <div *ngFor="let item of trades" class="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col p-4">
        <img *ngIf="item.image" [src]="item.image" class="w-full h-48 object-contain mb-4 bg-gray-50 rounded" />
        <h3 class="font-bold text-lg text-gray-800">{{ item.cardType }}</h3>
        <span class="text-xl font-extrabold text-blue-600 mt-2">฿{{ item.price | number }}</span>
      </div>
    </div>
  </div>
</ion-content>
