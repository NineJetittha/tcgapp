<ion-header class="ion-no-border">
  <ion-toolbar class="bg-white">
    <div class="flex justify-between items-center px-4 py-2">
      <button (click)="goBack()" class="text-blue-600 font-bold bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 transition">
        &larr; กลับหน้าหลัก
      </button>
      <h1 class="text-xl font-extrabold text-gray-800 m-0">ตลาดซื้อขาย (Shop)</h1>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-gray-50">
  <div class="p-4 md:p-6 max-w-7xl mx-auto">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div *ngFor="let item of products" class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition overflow-hidden border border-gray-100 flex flex-col">
        <div class="h-56 bg-gray-100 relative overflow-hidden p-2">
          <img [src]="item.image" class="w-full h-full object-cover rounded-lg" />
        </div>
        <div class="p-4 flex-1 flex flex-col">
          <p class="text-xs text-blue-600 font-bold mb-1">ผู้ขาย: {{ item.seller }}</p>
          <h3 class="font-bold text-lg text-gray-800 mb-1">{{ item.name }}</h3>
          <div class="mt-auto pt-3 border-t border-gray-100 flex justify-between items-center">
            <span class="text-xl font-extrabold text-red-500">฿{{ item.price | number }}</span>
            <!-- ปุ่มกดซื้อ -->
            <button (click)="buyItem(item)" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition shadow-md shadow-blue-200">
              หยิบใส่ตะกร้า
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
