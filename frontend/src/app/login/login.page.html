<ion-content class="bg-gray-50">
  <div class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
      
      <div class="text-center mb-8">
        <!-- โลโก้ TCG 3 มิติ สีรุ้ง Gradient -->
        <div class="relative w-24 h-24 mx-auto mb-5 cursor-pointer group">
          <div class="absolute inset-0 bg-gradient-to-tr from-pink-500 via-red-500 via-yellow-400 via-green-400 via-blue-500 to-purple-600 rounded-full blur-lg opacity-60 group-hover:opacity-100 group-hover:scale-110 transition-all duration-500"></div>
          <div class="relative w-full h-full rounded-full flex items-center justify-center text-white font-black text-3xl shadow-2xl bg-gradient-to-tr from-pink-500 via-red-500 via-yellow-400 via-green-400 via-blue-500 to-purple-600 border-4 border-white transform group-hover:scale-105 group-hover:rotate-6 transition-all duration-500">
            TCG
          </div>
        </div>
        
        <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">เข้าสู่ระบบ</h1>
        <p class="text-gray-500 text-sm mt-3 bg-gray-50 inline-block px-4 py-2 rounded-lg border border-gray-100">
          ผู้ดูแล: admin / Admin@1234<br>ผู้ใช้ทั่วไป: user / User@1234
        </p>
      </div>

      <form (ngSubmit)="onLogin()" class="flex flex-col gap-5">
        <div>
          <label class="text-sm font-bold text-gray-700">ชื่อผู้ใช้งาน</label>
          <input type="text" [(ngModel)]="username" name="username" required 
                 class="w-full mt-2 p-3.5 border-2 border-gray-200 rounded-xl focus:ring-0 focus:border-purple-500 focus:outline-none transition-colors bg-gray-50 hover:bg-white focus:bg-white text-gray-800" />
        </div>
        <div>
          <label class="text-sm font-bold text-gray-700">รหัสผ่าน</label>
          <input type="password" [(ngModel)]="password" name="password" required 
                 class="w-full mt-2 p-3.5 border-2 border-gray-200 rounded-xl focus:ring-0 focus:border-purple-500 focus:outline-none transition-colors bg-gray-50 hover:bg-white focus:bg-white text-gray-800" />
        </div>

        <div *ngIf="errorMessage" class="text-red-600 text-sm font-bold bg-red-50 p-3 rounded-xl text-center border border-red-100 animate-pulse">
          {{ errorMessage }}
        </div>

        <button type="submit" 
                class="group relative w-full flex justify-center py-4 px-4 mt-4 border border-transparent text-base font-extrabold rounded-xl text-white bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:via-indigo-500 hover:to-purple-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-[0_4px_14px_0_rgba(99,102,241,0.39)] hover:shadow-[0_6px_20px_rgba(99,102,241,0.4)] hover:-translate-y-1 transition-all duration-300">
          <span class="flex items-center gap-2">
            เข้าสู่ระบบ
            <svg class="w-5 h-5 transform group-hover:translate-x-1.5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </span>
        </button>
      </form>
      
      <!-- เพิ่มปุ่มสมัครสมาชิกใหม่ นอกแท็ก form แต่ยังอยู่ในการ์ดสีขาว -->
      <div class="mt-6 text-center">
        <span class="text-gray-500 text-sm">ยังไม่มีบัญชีใช่ไหม? </span>
        <a href="/register" class="text-purple-600 font-bold hover:underline cursor-pointer">สมัครสมาชิกใหม่</a>
      </div>

    </div>
  </div>
</ion-content>
