<ion-header class="ion-no-border">
  <ion-toolbar class="bg-white">
    <div class="flex justify-between items-center px-4 py-2">
      <button (click)="goBack()" class="text-blue-600 font-bold bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 transition">
        &larr; กลับหน้าหลัก
      </button>
      <h1 class="text-xl font-extrabold text-gray-800 m-0">จัดการการแข่งขัน</h1>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-gray-50">
  <div class="p-4 md:p-6 max-w-4xl mx-auto">
    
    <!-- ฟอร์มสร้าง Event (แสดงเฉพาะสิทธิ์ Admin เท่านั้น) -->
    <div *ngIf="currentUser?.role === 'admin'" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
      <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">สร้างทัวร์นาเมนต์ใหม่ (สำหรับ Admin)</h2>
      
      <form (ngSubmit)="onSubmit()" #eventForm="ngForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-semibold text-gray-600">วันที่ (Timestamp)</label>
          <input type="date" [(ngModel)]="eventData.date" name="date" required class="w-full mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        
        <div>
          <label class="text-sm font-semibold text-gray-600">รอบที่ (Round)</label>
          <input type="text" [(ngModel)]="eventData.round" name="round" placeholder="เช่น รอบคัดเลือก 1, Final" required class="w-full mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>

        <div>
          <label class="text-sm font-semibold text-gray-600">เวลาการแข่งขัน</label>
          <input type="time" [(ngModel)]="eventData.time" name="time" required class="w-full mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>

        <div>
          <label class="text-sm font-semibold text-gray-600">สถานที่แข่งขัน</label>
          <input type="text" [(ngModel)]="eventData.location" name="location" placeholder="เช่น ร้านการ์ด ABC, Discord" required class="w-full mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>

        <div class="md:col-span-2 mt-2">
          <button type="submit" [disabled]="!eventForm.valid" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed shadow-md shadow-indigo-200">
            ประกาศการแข่งขันและส่งแจ้งเตือน
          </button>
        </div>
      </form>
    </div>

    <!-- รายการ Event -->
    <h2 class="text-xl font-bold mb-4 text-gray-800">ตารางการแข่งขันที่กำลังจะมาถึง</h2>
    <div class="flex flex-col gap-4">
      <div *ngIf="events.length === 0" class="text-center py-8 bg-white rounded-2xl border border-dashed border-gray-300">
        <p class="text-gray-500 font-medium">ยังไม่มีตารางการแข่งขัน</p>
      </div>

      <div *ngFor="let ev of events" class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-indigo-500 flex justify-between items-center">
        <div>
          <h3 class="font-bold text-lg text-gray-800">{{ ev.round }}</h3>
          <p class="text-sm text-gray-500 mt-1">
            📍 {{ ev.location }} | 🕒 {{ ev.time }}
          </p>
        </div>
        
        <div class="flex flex-col gap-2 items-end">
          <div class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-lg font-bold text-sm">
            {{ ev.date }}
          </div>
          <!-- ปุ่มสมัครสำหรับ User ทั่วไปเท่านั้น -->
          <button *ngIf="currentUser?.role === 'user'" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-700 transition shadow-sm">
            ลงทะเบียนแข่งขัน
          </button>
        </div>
      </div>
    </div>

  </div>
</ion-content>
