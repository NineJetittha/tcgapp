version: '3.8'

services:
  api:
    build: ./backend
    container_name: tcg_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://db:27017/tcg_store
    depends_on:
      - db
    restart: always

  db:
    image: mongo:latest
    container_name: tcg_database
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data: